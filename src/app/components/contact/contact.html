<section class="contact" id="contact">
  <div class="container">
    <div class="section-title">
      <span>Get In Touch</span>
      <h2>Contact & Enquiries</h2>
    </div>

    <div class="contact-inner">
      <div class="contact-info">
        <h3>Reach Us</h3>
        <div class="info-items">
          <div class="info-item glass">
            <span class="info-icon">📍</span>
            <div>
              <strong>Address</strong>
              <p>Mankav, Kozhikode,<br>Kerala, India</p>
            </div>
          </div>
          <div class="info-item glass">
            <span class="info-icon">📞</span>
            <div>
              <strong>Phone</strong>
              <p>+91 8075410696</p>
            </div>
          </div>
          <div class="info-item glass">
            <span class="info-icon">✉️</span>
            <div>
              <strong>Email</strong>
              <p>info&#64;denhealthcare.com</p>
            </div>
          </div>
          <div class="info-item glass">
            <span class="info-icon">🕐</span>
            <div>
              <strong>Business Hours</strong>
              <p>Mon–Sat: 9am–6pm</p>
            </div>
          </div>
        </div>
      </div>

      <div class="form-wrapper glass">
        @if (submitted) {
          <div class="success-msg">
            <span>✅</span>
            <h3>Enquiry Received!</h3>
            <p>Our team will get back to you within 24 hours.</p>
          </div>
        } @else {
          <form (ngSubmit)="onSubmit()" #f="ngForm">
            <div class="form-row">
              <div class="form-group">
                <label>Full Name</label>
                <input type="text" [(ngModel)]="form.name" name="name" placeholder="Your name" required />
              </div>
              <div class="form-group">
                <label>Company / Organisation</label>
                <input type="text" [(ngModel)]="form.company" name="company" placeholder="Hospital / Clinic / Business" />
              </div>
            </div>
            <div class="form-row">
              <div class="form-group">
                <label>Email</label>
                <input type="email" [(ngModel)]="form.email" name="email" placeholder="you@company.com" required />
              </div>
              <div class="form-group">
                <label>Phone</label>
                <input type="tel" [(ngModel)]="form.phone" name="phone" placeholder="+91 00000 00000" />
              </div>
            </div>
            <div class="form-group">
              <label>Product of Interest</label>
              <select [(ngModel)]="form.product" name="product" required>
                <option value="" disabled>Select a product</option>
                @for (p of productTypes; track p) {
                  <option [value]="p">{{ p }}</option>
                }
              </select>
            </div>
            <div class="form-group">
              <label>Message / Quantity Required</label>
              <textarea [(ngModel)]="form.message" name="message" rows="3" placeholder="Tell us about your requirements..."></textarea>
            </div>
            <button type="submit" class="btn btn-primary submit-btn">Send Enquiry →</button>
          </form>
        }
      </div>
    </div>
  </div>
</section>
