<nav class="navbar" [class.scrolled]="scrolled()">
  <div class="container nav-inner">
    <a href="#home" class="logo">
      <span class="logo-icon">🏥</span>
      <span class="logo-text">Den<strong>Healthcare</strong></span>
    </a>

    <ul class="nav-links" [class.open]="menuOpen()">
      @for (link of navLinks; track link.label) {
        <li><a [href]="link.href" (click)="closeMenu()">{{ link.label }}</a></li>
      }
      <li><a href="#contact" class="btn btn-primary nav-cta" (click)="closeMenu()">Get a Quote</a></li>
    </ul>

    <button class="hamburger" (click)="toggleMenu()" [class.active]="menuOpen()" aria-label="Menu">
      <span></span><span></span><span></span>
    </button>
  </div>
</nav>
