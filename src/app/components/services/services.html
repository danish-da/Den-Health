<section class="services" id="medical">
  <div class="container">
    <div class="section-title">
      <span>Medical Equipment</span>
      <h2>Medical Grade Products</h2>
    </div>

    <div class="services-grid">
      @for (product of products; track product.title) {
        <div class="service-card glass">
          <div class="card-glow"></div>
          <div class="service-icon">{{ product.icon }}</div>
          <h3>{{ product.title }}</h3>
          <p>{{ product.desc }}</p>
          <a href="#contact" class="card-link">Enquire Now →</a>
        </div>
      }
    </div>
  </div>
</section>
